[tox]
envlist = ruff,py310,py311,py312,py313,docs,twinecheck,black
isolated_build = True

[testenv]
usedevelop = True
deps =
    pytest
    hypothesis
    Cython>=0.29.17  # This can possibly be removed when tox 4 comes out
# See pyproject.toml for pytest configuration
commands = pytest

[testenv:docs]
basepython = python3.10
skip_install = true
deps = -r doc/requirements.txt
commands =
    sphinx-build -q -W -b html -d {envtmpdir}/doctrees doc {envtmpdir}/html

[testenv:twinecheck]
basepython = python3.10
skip_install = true
deps =
    twine
    build
commands =
    python -m build --sdist --outdir {envtmpdir}/dist
    twine check {envtmpdir}/dist/*

[testenv:black]
basepython = python3.10
deps = black==24.3.0
skip_install = true
commands = black --check whatshap/ tests/ setup.py

[testenv:ruff]
basepython = python3.10
deps = ruff==0.16
skip_install = true
commands = ruff check whatshap/ tests/ setup.py

[testenv:mypy]
basepython = python3.10
deps = mypy
commands = mypy whatshap/
